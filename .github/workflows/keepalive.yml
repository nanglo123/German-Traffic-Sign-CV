name: Keep GTSRB Space awake

on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: GET the Space and confirm it serves its own page
        run: |
          set -o pipefail
          URL="https://nanglo123-gtsrb-deployment.hf.space/"
          for attempt in 1 2 3 4 5; do
            if curl -sSf --max-time 120 "$URL" | grep -q "GTSRB"; then
              echo "Space served its own page (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt: page not ready yet, waiting 30s..."
            sleep 30
          done
          echo "::error::Space never served its own page after 5 attempts over ~2.5 min — sleeping-and-stuck, building, or broken."
          exit 1

      - name: Confirm runtime stage is RUNNING
        run: |
          set -o pipefail
          API="https://huggingface.co/api/spaces/nanglo123/GTSRB-Deployment/runtime"
          stage=$(curl -sSf --max-time 30 "$API" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["stage"])')
          echo "stage=$stage"
          if [ "$stage" != "RUNNING" ]; then
            echo "::error::Space stage is $stage, not RUNNING. Check the build logs at https://huggingface.co/spaces/nanglo123/GTSRB-Deployment"
            exit 1
          fi
          echo "Stage is RUNNING."
